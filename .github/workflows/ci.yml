name: HomeExpense CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve Build Scripts
        run: pnpm approve-builds --all

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"
        run: pnpm --filter @homeexpense/database run prisma:validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"
        run: pnpm --filter @homeexpense/database run prisma:generate

      - name: Run Financial Invariant & Unit Tests
        run: pnpm test

      - name: Build All Monorepo Packages
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"
          JWT_SECRET: "ci_pipeline_dummy_secret_key_minimum_32_characters"
        run: pnpm build
